nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
nav button{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--txt);font:inherit;cursor:pointer}
nav button.on{background:var(--gold);color:#143;border-color:var(--gold);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.ar{font-family:Amiri,'Traditional Arabic',serif;font-size:23px;line-height:2.1}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--mut)}
.src{color:var(--gold)}
.cnt{padding:6px 14px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font:inherit;cursor:pointer}

.tg{display:flex;gap:6px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
.bar{height:8px;background:#0a2c22;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:18px}

["آية الكرسي",KURSI,1,"النسائي في الكبرى 9848، وصححه الألباني (من قرأها دبر كل صلاة لم يمنعه من دخول الجنة إلا الموت)"],
["المعوذات",MAW,1,"أبو داود 1523، والترمذي 2903، وصححه الألباني (يقرؤها دبر كل صلاة)"],
["اللهم أعني على ذكرك","اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.",1,"أبو داود 1522، والنسائي 1303، وصححه الألباني"]
]};
const ACC=["صليت الفرائض في وقتها","صليت الفرائض جماعةً (للرجال)","حافظت على السنن الرواتب","أتيت بأذكار الصباح","أتيت بأذكار المساء","قرأت وردي من القرآن","صليت الوتر","تصدقت ولو بالقليل","بررت والديَّ ووصلت رحمي","حفظت لساني وعيني وسمعي","أحسنت إلى من حولي","استغفرت وتبت من ذنوبي"];
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=dk(new Date());
const hj=(d,o)=>new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura",o).format(d);
$("#hdate").textContent=hj(new Date(),{weekday:"long",day:"numeric",month:"long",year:"numeric"});
let tab="morning",counts=ld("adh:c:"+today,{}),acc=ld("adh:a:"+today,{});
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\n/g,"<br>");
function nav(){$("#tabs").innerHTML=T.map(t=>`<button class="${t[0]===tab?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}
function card(g,i,x){const id=g+i,c=counts[id]||0,n=x[2],fin=c>=n;
return `<div class="card"><div style="font-weight:700;color:var(--gold)">${x[0]}</div><div class="ar">${esc(x[1])}</div><div class="meta"><span class="src">المصدر: ${x[3]}</span><button class="cnt ${fin?"fin":""}" data-c="${id}" data-n="${n}">${fin?"تم ✓":"التكرار: "+c+" / "+n}</button></div></div>`}
function render(){nav();const q=$("#q").value.trim();let h="";
if(q){const norm=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");const k=norm(q);let f=0;
for(const g in D)D[g].forEach((x,i)=>{if(norm(x[0]+" "+x[1]+" "+x[3]).includes(k)){f++;h+=card(g,i,x)}});
$("#out").innerHTML=(f?`<div class="sub">نتائج البحث: ${f}</div>`:'<div class="card">لا توجد نتائج.</div>')+h;return}
if(D[tab])h=D[tab].map((x,i)=>card(tab,i,x)).join("");
else if(tab==="acc")h=accView();else h=stats();
$("#out").innerHTML=h}
function accView(){const done=ACC.filter((_,i)=>acc[i]===1).length;
return `<div class="card"><div style="font-weight:700;color:var(--gold)">محاسبة النفس لهذا اليوم</div><div class="sub">«حاسبوا أنفسكم قبل أن تحاسبوا» — أثر عن عمر رضي الله عنه، رواه ابن أبي شيبة وغيره. أجب بصدق: تم أو لم يتم.</div><div class="bar" style="margin:10px 0"><i style="width:${done/ACC.length*100}%"></i></div>`+
ACC.map((t,i)=>`<div class="row"><span>${t}</span><span class="tg"><button class="y ${acc[i]===1?"on":""}" data-a="${i}" data-v="1">تم</button><button class="n ${acc[i]===0?"on":""}" data-a="${i}" data-v="0">لم يتم</button></span></div>`).join("")+`<div class="sub" style="margin-top:8px">أنجزت ${done} من ${ACC.length}. وما قصّرت فيه فاستغفر الله وجدّد العزم غدًا.</div></div>`}
function stats(){const rows=[];
try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("adh:a:")){const a=JSON.parse(localStorage.getItem(k));const v=Object.values(a);if(v.length)rows.push([k.slice(6),v.filter(x=>x===1).length,ACC.length])}}}catch(e){}
const grp=f=>{const m={};rows.forEach(r=>{const key=f(new Date(r[0]+"T12:00:00"),r[0]);(m[key]=m[key]||{d:0,t:0,n:0});m[key].d+=r[1];m[key].t+=r[2];m[key].n++});return m};
const wk=grp((d)=>{const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+1)%7));return hj(s,{day:"numeric",month:"long",year:"numeric"})});
const mo=grp(d=>hj(d,{month:"long",year:"numeric"})),yr=grp(d=>hj(d,{year:"numeric"}));
const tb=(title,m,lab)=>{const e=Object.entries(m);return `<div class="card"><div style="font-weight:700;color:var(--gold)">${title}</div>`+(e.length?`<table><tr><th>${lab}</th><th>أيام</th><th>الإنجاز</th></tr>`+e.sort().reverse().map(([k,v])=>{const p=Math.round(v.d/v.t*100);return `<tr><td>${k}</td><td>${v.n}</td><td><div class="bar"><i style="width:${p}%"></i></div>${p}%</td></tr>`}).join("")+"</table>":'<div class="sub">لا توجد بيانات بعد؛ سجّل محاسبتك في تبويب «محاسبة النفس».</div>')+"</div>"};
return tb("الجدول الأسبوعي (أسبوع يبدأ يوم السبت، بالتاريخ الهجري)",wk,"بداية الأسبوع")+tb("الجدول الشهري (هجري)",mo,"الشهر")+tb("الجدول السنوي (هجري)",yr,"السنة")+'<div class="sub">تُحفظ بياناتك في متصفحك على جهازك فقط.</div>'}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.t){tab=b.dataset.t;$("#q").value="";render()}
else if(b.dataset.c){const id=b.dataset.c,n=+b.dataset.n;counts[id]=Math.min(n,(counts[id]||0)+1);sv("adh:c:"+today,counts);render()}
else if(b.dataset.a){const i=b.dataset.a,v=+b.dataset.v;acc[i]=acc[i]===v?undefined:v;if(acc[i]===undefined)delete acc[i];sv("adh:a:"+today,acc);render()}});
$("#q").addEventListener("input",render);
render();
let dp=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("#inst").style.display="inline-block"});
$("#inst").addEventListener("click",async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$("#inst").style.display="none"}});
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
</script>
</body>
</html>
